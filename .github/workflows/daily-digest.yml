# Post-close daily digest email — Gmail SMTP after US extended session.
# Persistence: restore ledger from `agent-data`, then save strategy_prev.json back.

name: Daily digest

on:
  schedule:
    # ~20:20 ET after extended close (4:00–20:00 ET).
    # 00:20 UTC = 20:20 EDT; 01:20 UTC = 20:20 EST. Tue–Sat for Mon–Fri sessions.
    - cron: "20 0 * * 2-6"
    - cron: "20 1 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "America/New_York date YYYY-MM-DD (blank = today ET)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry run (no SMTP / no strategy_prev update)"
        type: boolean
        default: false
      skip_gemini:
        description: "Skip Gemini (local fallback briefing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sp500-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sp500-backend/requirements.txt

      - name: Restore ledger from agent-data branch
        run: |
          set -euo pipefail
          mkdir -p sp500-backend/data
          git fetch origin agent-data:agent-data 2>/dev/null || echo "No agent-data branch yet (first run)."
          if git rev-parse --verify agent-data >/dev/null 2>&1; then
            for f in portfolio.json equity.jsonl reports.jsonl strategy.json strategy_prev.json screen_cache.json sp500.json; do
              if git cat-file -e "agent-data:data/$f" 2>/dev/null; then
                git show "agent-data:data/$f" > "sp500-backend/data/$f"
                echo "Restored data/$f"
              fi
            done
          fi
          ls -la sp500-backend/data || true

      - name: Run daily digest
        working-directory: sp500-backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO_VAR: ${{ vars.DIGEST_TO }}
          DIGEST_TO_SECRET: ${{ secrets.DIGEST_TO }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing GEMINI_API_KEY repository secret."
            exit 1
          fi
          export GEMINI_MODEL="${GEMINI_MODEL:-gemini-flash-latest}"
          export DIGEST_TO="${DIGEST_TO_VAR:-${DIGEST_TO_SECRET:-hargung123456@gmail.com}}"
          export DIGEST_ENABLED="${DIGEST_ENABLED:-true}"
          export SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
          export SMTP_PORT="${SMTP_PORT:-587}"

          DRY="${{ inputs.dry_run }}"
          SKIP="${{ inputs.skip_gemini }}"
          DATE_IN="${{ inputs.date }}"
          # Scheduled runs have empty inputs; treat as false / blank.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            DRY="false"
            SKIP="false"
            DATE_IN=""
          fi

          if [ "${DRY}" != "true" ]; then
            if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
              echo "Missing SMTP_USER / SMTP_PASSWORD secrets (Gmail App Password)."
              exit 1
            fi
          fi

          ARGS=()
          if [ -n "${DATE_IN}" ]; then
            ARGS+=(--date "${DATE_IN}")
          fi
          if [ "${DRY}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${SKIP}" = "true" ]; then
            ARGS+=(--skip-gemini)
          fi
          python run_daily_digest.py "${ARGS[@]}"

      - name: Persist strategy_prev to agent-data branch
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          set -euo pipefail
          if [ ! -f sp500-backend/data/strategy_prev.json ]; then
            echo "No strategy_prev.json to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGE=$(mktemp -d)
          cp sp500-backend/data/strategy_prev.json "$STAGE/strategy_prev.json"

          CODE_REF="${GITHUB_SHA}"
          git fetch origin agent-data:agent-data 2>/dev/null || true

          if git rev-parse --verify agent-data >/dev/null 2>&1; then
            git switch --force agent-data
          else
            git switch --orphan agent-data
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p data
            printf '%s\n' '# agent-data' '' 'Durable paper-trading ledger for GitHub Actions cron.' 'Do not store API keys here.' > README.md
          fi

          mkdir -p data
          cp -f "$STAGE/strategy_prev.json" data/strategy_prev.json
          git add data/strategy_prev.json README.md 2>/dev/null || git add data/strategy_prev.json
          if git diff --staged --quiet; then
            echo "No strategy_prev changes to commit."
          else
            git commit -m "chore(agent-data): digest strategy_prev $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:agent-data
          fi

          git switch --detach "$CODE_REF" >/dev/null 2>&1 || true
